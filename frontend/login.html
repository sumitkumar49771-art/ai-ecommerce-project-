<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — ShopAI</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="form-card">
    <h2>Login</h2>
    <div id="alert-box"></div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <p style="text-align:right; margin:-8px 0 12px;"><a href="forgot-password.html" style="font-size:13px;">Forgot password?</a></p>
      <button class="btn" style="width:100%" type="submit">Login</button>
    </form>

    <form id="otp-form" style="display:none" onsubmit="handleAdminOtp(event)">
      <p class="form-note" style="margin-top:0">A 6-digit code was sent to the admin email. Enter it below to finish logging in.</p>
      <div class="form-group">
        <label>Login Code</label>
        <input type="text" id="admin-otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required />
      </div>
      <p id="otp-timer" class="form-note" style="margin-top:-8px; text-align:right; font-size:13px;"></p>
      <button class="btn" style="width:100%" type="submit">Verify Code</button>
    </form>

    <p class="form-note">Don't have an account? <a href="register.html">Sign up</a></p>
    <p class="form-note">Demo user: user@example.com / User@1234</p>
  </div>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
